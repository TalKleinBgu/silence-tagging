        const AlertCircleIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        );

        const DEFAULT_CATEGORIES = [
            'שתיקה פרגמטית (Pragmatic)',
            'שליפה פשוטה (Retrieval Silence)',
            'עיבוד (Processing Silence)',
            'רגשית (Emotional Silence)',
            'הפתעה (Surprise Silence)',
            'מבוכה (Embarrassment Silence)'
        ];
        
        // Category explanations from the guide
        const CATEGORY_EXPLANATIONS = {
            'שתיקה פרגמטית (Pragmatic)': 'שתיקה שממלאת תפקיד תקשורתי או חברתי בשיחה. היא משמשת כסימן מכוון, למשל לפני החלפת נושא, לצורך הובלת השיחה לכיוון מסוים, או לעידוד המרואיין להמשיך לדבר.',
            'שליפה פשוטה (Retrieval Silence)': 'שתיקה קצרה שמופיעה כאשר הדובר יודע מה הוא רוצה לומר, אך עוצר לרגע כדי לשלוף מידע מוכר, להתנסח או לארגן משפט פשוט.',
            'עיבוד (Processing Silence)': 'שתיקה שמופיעה כאשר הדובר מעבד באופן מעמיק את הדברים שנאמרו, כדי לגבש עמדה, לחשוב על משמעות רחבה יותר או לנסח תגובה מורכבת. תפקידה לארגן מחשבה לקראת מהלך שיח משמעותי, כמו פרשנות, אתגור, טיעון או עמדה מורכבת.',
            'רגשית (Emotional Silence)': 'שתיקה שמופיעה כאשר העומס הרגשי גורם לדובר לקושי להמשיך את דבריו, למשל בעקבות עצב, התרגשות או לחץ. בנוסף, שתיקה זו יכולה להופיע כאשר השומע מתרגש מן הנאמר ונעצר כדי לעבד את התחושה.',
            'הפתעה (Surprise Silence)': 'שתיקה שמופיעה בעקבות אירוע לא צפוי כמו אמירה, התנהגות או מראה, אשר חורגים מהתדמית המוכרת של האדם או מציפיות ומסגרת השיחה. השתיקה מסמנת שהייה המאפשרת להבין את האירוע הלא צפוי.',
            'מבוכה (Embarrassment Silence)': 'שתיקה שנגרמת עקב אירוע לא צפוי כמו אמירה או התנהגות, אשר יתכן וחורגים מנורמה חברתית ומייצרים אי נוחות חברתית. השתיקה מייצגת חוסר נעימות רגעית, בה הדובר מחפש כיצד להגיב לאירוע.'
        };

        // Admin users list - add usernames here
        const ADMIN_USERS = ['טל', 'זיו', 'אליה', 'admin',"רובי"];

        const PodcastTaggingApp = () => {
            const [username, setUsername] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedTags, setSelectedTags] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [allTags, setAllTags] = useState({});
            const [loading, setLoading] = useState(true);
            const [dataset, setDataset] = useState([]);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('tagging');
            const [syncStatus, setSyncStatus] = useState('local'); // 'local', 'syncing', 'synced', 'error'
            const [lastSync, setLastSync] = useState(null);
            const [registeredUsers, setRegisteredUsers] = useState({}); // {username: {categories: [...], isAdmin: false, assignedItems: []}}
            const [newUserName, setNewUserName] = useState('');
            const [newUserCategories, setNewUserCategories] = useState([]);
            const [newUserIsAdmin, setNewUserIsAdmin] = useState(false);
            const [newUserItemsStart, setNewUserItemsStart] = useState('');
            const [newUserItemsEnd, setNewUserItemsEnd] = useState('');
            const [editingUserItems, setEditingUserItems] = useState(null); // username being edited
            const [editingDataItem, setEditingDataItem] = useState(null); // data item being edited
            const [editingDataValues, setEditingDataValues] = useState({}); // values being edited
            const [dataSearchTerm, setDataSearchTerm] = useState('');
            const [importJsonText, setImportJsonText] = useState('');
            const [untaggedIndex, setUntaggedIndex] = useState(0); // Index within untagged items only
            const [categories, setCategories] = useState(DEFAULT_CATEGORIES); // Dynamic categories
            const [newCategoryName, setNewCategoryName] = useState('');
            const [tagsFilterUser, setTagsFilterUser] = useState(''); // Filter by user
            const [tagsFilterCategory, setTagsFilterCategory] = useState(''); // Filter by category
            const [tagsFilterPodcast, setTagsFilterPodcast] = useState(''); // Filter by podcast
            const [tagsFilterItemId, setTagsFilterItemId] = useState(''); // Filter by item ID
            const [tagsSearchTerm, setTagsSearchTerm] = useState(''); // Search in text
            const [editingItem, setEditingItem] = useState(null); // Item being edited (from My Progress)
            const [listenCount, setListenCount] = useState(1); // How many times user listened to audio
            const [playCount, setPlayCount] = useState(0); // How many times user clicked play
            const [pauseCount, setPauseCount] = useState(0); // How many times user paused audio
            const [seekForwardCount, setSeekForwardCount] = useState(0); // How many times user seeked forward
            const [seekBackwardCount, setSeekBackwardCount] = useState(0); // How many times user seeked backward
            const [lastSeekTime, setLastSeekTime] = useState(0); // Track last seek time to detect direction
            const [audioPlayed, setAudioPlayed] = useState(false); // Track if user played audio for current item
            const [showWelcomeModal, setShowWelcomeModal] = useState(false); // Will be shown after login
            const [dontShowAgain, setDontShowAgain] = useState(false); // Default unchecked
            const [audioCurrentTime, setAudioCurrentTime] = useState(0); // Current playback time
            const [audioDuration, setAudioDuration] = useState(0); // Total audio duration
            const [highlightedWordIndex, setHighlightedWordIndex] = useState(-1); // Current highlighted word
            const [currentSection, setCurrentSection] = useState('before'); // 'before', 'silence', 'after'
            const [recognizedText, setRecognizedText] = useState(''); // Text recognized by speech API
            const [wordTimestamps, setWordTimestamps] = useState(null); // AssemblyAI word timestamps
            const [isTranscribing, setIsTranscribing] = useState(false); // Transcription in progress
            const [transcriptionError, setTranscriptionError] = useState(null); // Transcription error
            const [transcriptionStats, setTranscriptionStats] = useState({ total: 0, withTranscription: 0 }); // Stats for admin panel
            const [hoveredCategory, setHoveredCategory] = useState(null); // Category being hovered for tooltip
            const [tooltipPosition, setTooltipPosition] = useState({ x: 0, y: 0 }); // Tooltip position
            const audioRef = useRef(null);
            const fileInputRef = useRef(null);
            const recognitionRef = useRef(null);
            const beforeTextRef = useRef(null); // Ref for before text container
            const afterTextRef = useRef(null); // Ref for after text container
            const lastSeekTimestampRef = useRef(0); // Track when last seek happened to ignore play/pause near it

            // Check if current user is admin
            const isAdmin = ADMIN_USERS.includes(username) || (registeredUsers[username]?.isAdmin);
            
            // Get allowed categories for current user
            const getAllowedCategories = () => {
                if (isAdmin) return categories;
                if (registeredUsers[username]) {
                    // Filter user's allowed categories to only include those that still exist
                    const userCats = registeredUsers[username].categories || categories;
                    return userCats.filter(cat => categories.includes(cat));
                }
                return categories; // Default to all categories for unregistered users
            };
            
            const allowedCategories = getAllowedCategories();

            // AssemblyAI transcription function
            const transcribeWithAssemblyAI = async (audioUrl, itemId) => {
                if (!ASSEMBLYAI_API_KEY) {
                    console.log('AssemblyAI API key not configured');
                    return null;
                }
                
                // Check if we already have transcription cached
                if (window.firebaseEnabled && window.database) {
                    try {
                        const snapshot = await window.database.ref(`transcriptions/${itemId}`).once('value');
                        const cached = snapshot.val();
                        if (cached && cached.words) {
                            console.log('Using cached transcription for', itemId);
                            return cached;
                        }
                    } catch (e) {
                        console.log('No cached transcription found');
                    }
                }
                
                setIsTranscribing(true);
                setTranscriptionError(null);
                
                try {
                    // Step 1: Submit audio for transcription
                    const transcriptResponse = await fetch('https://api.assemblyai.com/v2/transcript', {
                        method: 'POST',
                        headers: {
                            'Authorization': ASSEMBLYAI_API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            audio_url: audioUrl,
                            language_code: 'he' // Hebrew
                        })
                    });
                    
                    if (!transcriptResponse.ok) {
                        throw new Error(`API error: ${transcriptResponse.status}`);
                    }
                    
                    const transcriptData = await transcriptResponse.json();
                    const transcriptId = transcriptData.id;
                    
                    // Step 2: Poll for completion
                    let result = null;
                    let attempts = 0;
                    const maxAttempts = 60; // Max 2 minutes (2s * 60)
                    
                    while (attempts < maxAttempts) {
                        await new Promise(resolve => setTimeout(resolve, 2000)); // Wait 2 seconds
                        
                        const pollResponse = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptId}`, {
                            headers: {
                                'Authorization': ASSEMBLYAI_API_KEY
                            }
                        });
                        
                        const pollData = await pollResponse.json();
                        
                        if (pollData.status === 'completed') {
                            result = pollData;
                            break;
                        } else if (pollData.status === 'error') {
                            throw new Error(pollData.error || 'Transcription failed');
                        }
                        
                        attempts++;
                    }
                    
                    if (!result) {
                        throw new Error('Transcription timed out');
                    }
                    
                    // Extract word timestamps
                    const transcription = {
                        text: result.text,
                        words: result.words.map(w => ({
                            text: w.text,
                            start: w.start, // in milliseconds
                            end: w.end,
                            confidence: w.confidence
                        })),
                        duration: result.audio_duration * 1000 // convert to ms
                    };
                    
                    // Cache in Firebase
                    if (window.firebaseEnabled && window.database) {
                        try {
                            await window.database.ref(`transcriptions/${itemId}`).set(transcription);
                            console.log('Transcription cached for', itemId);
                        } catch (e) {
                            console.error('Failed to cache transcription:', e);
                        }
                    }
                    
                    setIsTranscribing(false);
                    return transcription;
                    
                } catch (error) {
                    console.error('AssemblyAI transcription error:', error);
                    setTranscriptionError(error.message);
                    setIsTranscribing(false);
                    return null;
                }
            };

            // Get allowed items for current user
            const getAllowedItems = () => {
                if (isAdmin) return dataset;
                if (registeredUsers[username]?.assignedItems && registeredUsers[username].assignedItems.length > 0) {
                    return dataset.filter((_, index) => 
                        registeredUsers[username].assignedItems.includes(index)
                    );
                }
                return dataset; // Default to all items
            };
            
            const allowedDataset = getAllowedItems();

            // Get user's progress - what's tagged and what's not
            const getUserProgress = () => {
                const tagged = [];
                const untagged = [];
                
                allowedDataset.forEach((item, idx) => {
                    const itemTags = allTags[item.id] || [];
                    const userTagged = itemTags.find(t => t.username === username);
                    if (userTagged) {
                        tagged.push({ ...item, originalIndex: idx, userTags: userTagged.tags, listenCount: userTagged.listen_count || 1, timestamp: userTagged.timestamp });
                    } else {
                        untagged.push({ ...item, originalIndex: idx });
                    }
                });
                
                return { tagged, untagged, total: allowedDataset.length };
            };

            // Get only untagged items for the tagging tab
            const getUntaggedItems = () => {
                return allowedDataset.filter(item => {
                    const itemTags = allTags[item.id] || [];
                    return !itemTags.some(t => t.username === username);
                });
            };

            // Load dataset and tags from storage
            useEffect(() => {
                loadData();
            }, []);

            // Subscribe to Firebase changes
            useEffect(() => {
                console.log('Firebase check - enabled:', window.firebaseEnabled, 'database:', !!window.database);
                
                if (!window.firebaseEnabled || !window.database) {
                    console.log('Firebase not available, staying in local mode');
                    return;
                }
                
                console.log('Connecting to Firebase...');
                setSyncStatus('syncing');
                
                const tagsRef = window.database.ref('podcast-tags');
                
                const unsubscribe = tagsRef.on('value', (snapshot) => {
                    console.log('Firebase data received:', snapshot.val());
                    const data = snapshot.val();
                    if (data) {
                        setAllTags(data);
                        // Also save to localStorage as backup
                        localStorage.setItem('podcast-tags', JSON.stringify(data));
                    }
                    setLastSync(new Date());
                    setSyncStatus('synced');
                }, (error) => {
                    console.error('Firebase sync error:', error);
                    setSyncStatus('error');
                });
                
                return () => tagsRef.off('value', unsubscribe);
            }, []);

            // Subscribe to Firebase for registered users
            useEffect(() => {
                if (!window.firebaseEnabled || !window.database) return;
                
                const usersRef = window.database.ref('registered-users');
                
                const unsubscribe = usersRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setRegisteredUsers(data);
                        localStorage.setItem('registered-users', JSON.stringify(data));
                    }
                });
                
                return () => usersRef.off('value', unsubscribe);
            }, []);

            // Subscribe to Firebase for categories
            useEffect(() => {
                if (!window.firebaseEnabled || !window.database) return;
                
                const categoriesRef = window.database.ref('categories');
                
                const unsubscribe = categoriesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && Array.isArray(data)) {
                        setCategories(data);
                        localStorage.setItem('categories', JSON.stringify(data));
                    }
                });
                
                return () => categoriesRef.off('value', unsubscribe);
            }, []);

            // Load transcription stats for admin panel
            useEffect(() => {
                if (activeTab !== 'transcriptions') return;
                
                const loadTranscriptionStats = async () => {
                    if (window.firebaseEnabled && window.database) {
                        try {
                            const snapshot = await window.database.ref('transcriptions').once('value');
                            const data = snapshot.val();
                            const count = data ? Object.keys(data).length : 0;
                            setTranscriptionStats({ total: dataset.length, withTranscription: count });
                        } catch (e) {
                            console.error('Error loading transcription stats:', e);
                        }
                    }
                };
                loadTranscriptionStats();
            }, [activeTab, dataset.length]);

            // Load transcription when current item changes
            // We need to compute the current item ID here for the dependency
            const currentItemForTranscription = React.useMemo(() => {
                if (editingItem) return editingItem;
                // Use the same logic as getUntaggedItems - check allTags instead of item.tagged
                const untagged = dataset.filter(item => {
                    const itemTags = allTags[item.id] || [];
                    return !itemTags.some(t => t.username === username);
                });
                return untagged[untaggedIndex] || null;
            }, [dataset, untaggedIndex, editingItem, allTags, username]);
            
            const currentItemIdForTranscription = currentItemForTranscription?.id;
            
            React.useEffect(() => {
                const loadTranscription = async (itemId) => {
                    if (!itemId) {
                        setWordTimestamps(null);
                        return;
                    }
                    
                    console.log('📥 Loading transcription for item:', itemId);
                    console.log('   🎧 Current item text_before:', currentItemForTranscription?.text_before?.substring(0, 50));
                    console.log('   🔊 Current item audio_url:', currentItemForTranscription?.audio_url?.substring(0, 80));
                    console.log('   ⏱️ Silence offset:', currentItemForTranscription?.silence_offset_hms, '| Duration:', currentItemForTranscription?.silence_duration);
                    
                    if (window.firebaseEnabled && window.database) {
                        try {
                            const snapshot = await window.database.ref(`transcriptions/${itemId}`).once('value');
                            const cached = snapshot.val();
                            if (cached && cached.words) {
                                console.log('✅ Transcription loaded for:', itemId);
                                console.log('   📝 First words:', cached.words.slice(0, 5).map(w => w.text).join(' '));
                                console.log('   🔊 Audio URL in transcription:', cached.audioUrl || 'not saved');
                                setWordTimestamps(cached);
                                return;
                            } else {
                                console.log('⚠️ No transcription found for:', itemId);

                const currentTimeMs = currentTime * 1000; // Convert to milliseconds

                const textAfter = currentDisplayItem.text_after || '';
                const silenceDuration = currentDisplayItem.silence_duration || 0;
                
                const wordsBefore = textBefore.split(/\s+/).filter(w => w);

                let newSection = currentSection;

                // If we have AssemblyAI timestamps, use them for precise sync
                if (wordTimestamps && wordTimestamps.words && wordTimestamps.words.length > 0) {

                    // Get silence offset time in ms
                    const silenceOffsetMs = parseTimeToMs(currentDisplayItem.silence_offset_hms);
                    const silenceEndMs = silenceOffsetMs + (silenceDuration * 1000);
                    
                    // Split words into before and after silence
                    const wordsBeforeSilence = words.filter(w => w.end <= silenceOffsetMs);
                    const wordsAfterSilence = words.filter(w => w.start >= silenceEndMs);
                    
                    // Find the current word based on timestamp
                    let currentWordIdx = -1;
                    let foundWord = null;
                    for (let i = 0; i < words.length; i++) {
                        if (currentTimeMs >= words[i].start && currentTimeMs <= words[i].end) {
                            currentWordIdx = i;
                            foundWord = words[i];
                            break;
                        }
                        // Also check if we're between words
                        if (i < words.length - 1 && currentTimeMs > words[i].end && currentTimeMs < words[i + 1].start) {
                            currentWordIdx = i; // Stay on last spoken word
                            foundWord = words[i];
                            break;
                        }
                    }
                    
                    // Determine section and relative word index
                    if (currentTimeMs < silenceOffsetMs) {
                        // Before silence
                        newSection = 'before';
                        // Find index within before section
                        const beforeIdx = wordsBeforeSilence.findIndex(w => w === foundWord);
                        newWordIndex = beforeIdx >= 0 ? beforeIdx : (foundWord ? wordsBeforeSilence.length - 1 : -1);
                    } else if (currentTimeMs >= silenceOffsetMs && currentTimeMs <= silenceEndMs) {
                        // During silence
                        newSection = 'silence';
                        newWordIndex = -1;
                    } else {
                        // After silence
                        newSection = 'after';
                        // Find index within after section
                        const afterIdx = wordsAfterSilence.findIndex(w => w === foundWord);
                        newWordIndex = afterIdx >= 0 ? afterIdx : (wordsAfterSilence.length > 0 ? 0 : -1);
                    }
                } else {
                    // Fallback: Estimate timing using linear distribution
                    const beforeDuration = (duration - silenceDuration) * 0.5;
                    const silenceStart = beforeDuration;
                    const silenceEnd = silenceStart + silenceDuration;
                    
                    if (currentTime < silenceStart && wordsBefore.length > 0) {
                        newSection = 'before';
                        newWordIndex = Math.floor((currentTime / beforeDuration) * wordsBefore.length);
                        newWordIndex = Math.min(newWordIndex, wordsBefore.length - 1);
                    } else if (currentTime < silenceEnd) {

                        newWordIndex = -1;
                    } else if (wordsAfter.length > 0) {

                        newWordIndex = Math.floor((afterTime / afterDuration) * wordsAfter.length);

                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            // Simple CSV parsing (handles quoted fields)
                            const values = lines[i].match(/("([^"]*)")|([^,]+)/g) || [];
                            const item = {};
                            headers.forEach((header, idx) => {
                                let val = values[idx] || '';
                                val = val.replace(/^"|"$/g, '').replace(/""/g, '"');
                                item[header] = val;
                            });
                            data.push(item);
                        }
                        importDataset(data);

                                        <button
                                            onClick={async () => {
                                                if (!confirm('האם לטעון מחדש מ-HuggingFace? פעולה זו תחליף את הדאטא הקיים.')) return;
                                                setLoading(true);
                                                try {
                                                    const newData = await fetchFromHuggingFace();
                                                    setDataset(newData);
                                                    await saveDatasetToStorage(newData);
                                                    alert(`נטענו ${newData.length} פריטים מ-HuggingFace ונשמרו!`);
                                                } catch (err) {
                                                    alert('שגיאה בטעינה: ' + err.message);
                                                }
                                                setLoading(false);
                                            }}
                                            className="w-full py-2 bg-orange-100 hover:bg-orange-200 text-orange-700 rounded-lg font-medium transition"
                                        >
                                            🔄 טען מחדש מ-HuggingFace
                                        </button>
                                        <p className="text-xs text-gray-500 text-center">
                                            הדאטא נשמר ב-Firebase ונטען אוטומטית
                                        </p>
                                    </div>
                                </div>

                                {/* Data Table */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 lg:col-span-3">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-semibold text-gray-800">טבלת דאטא ({getFilteredDataset().length} פריטים)</h2>
                                        <input
                                            type="text"
                                            placeholder="חיפוש..."
                                            value={dataSearchTerm}
                                            onChange={(e) => setDataSearchTerm(e.target.value)}
                                            className="px-4 py-2 border border-gray-300 rounded-lg w-64"
                                        />
                                    </div>
                                    
                                    <div className="overflow-x-auto max-h-[500px] overflow-y-auto">
                                        <table className="w-full text-right text-sm">
                                            <thead className="sticky top-0 bg-white border-b">
                                                <tr>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">#</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">מזהה</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">טקסט לפני</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">טקסט אחרי</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">זמן השתיקה</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">הזמן באודיו</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">דובר</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">פודקאסט</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">אודיו</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">פעולות</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {getFilteredDataset().map((item, idx) => (
                                                    <tr key={item.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                        {editingDataItem === item.id ? (
                                                            // Edit mode
                                                            <>
                                                                <td className="py-2 px-2">{idx + 1}</td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.id}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, id: e.target.value})}
                                                                        className="w-24 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <textarea
                                                                        value={editingDataValues.text_before}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, text_before: e.target.value})}
                                                                        className="w-full px-1 py-0.5 border rounded text-xs h-16"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <textarea
                                                                        value={editingDataValues.text_after}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, text_after: e.target.value})}
                                                                        className="w-full px-1 py-0.5 border rounded text-xs h-16"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        type="number"
                                                                        step="0.01"
                                                                        value={editingDataValues.silence_duration}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, silence_duration: e.target.value})}
                                                                        className="w-16 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.silence_offset_hms || ''}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, silence_offset_hms: e.target.value})}
                                                                        className="w-20 px-1 py-0.5 border rounded text-xs"
                                                                        placeholder="00:00:00"
                                                                        dir="ltr"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.speaker}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, speaker: e.target.value})}
                                                                        className="w-12 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                    →
                                                                    <input
                                                                        value={editingDataValues.next_speaker}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, next_speaker: e.target.value})}
                                                                        className="w-12 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.podcast_id}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, podcast_id: e.target.value})}
                                                                        className="w-24 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.audio_url || ''}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, audio_url: e.target.value})}
                                                                        className="w-24 px-1 py-0.5 border rounded text-xs"
                                                                        placeholder="URL"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <div className="flex gap-1">
                                                                        <button
                                                                            onClick={saveEditDataItem}
                                                                            className="px-2 py-1 bg-green-500 text-white rounded text-xs"
                                                                        >
                                                                            שמור
                                                                        </button>
                                                                        <button
                                                                            onClick={cancelEditDataItem}
                                                                            className="px-2 py-1 bg-gray-300 rounded text-xs"
                                                                        >
                                                                            ביטול
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </>
                                                        ) : (
                                                            // View mode
                                                            <>
                                                                <td className="py-2 px-2 text-gray-500">{idx + 1}</td>
                                                                <td className="py-2 px-2 text-xs text-gray-500">{item.id}</td>
                                                                <td className="py-2 px-2 max-w-xs">
                                                                    <div className="truncate" title={item.text_before}>
                                                                        {item.text_before.substring(0, 40)}...
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 px-2 max-w-xs">
                                                                    <div className="truncate" title={item.text_after}>
                                                                        {item.text_after.substring(0, 40)}...
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 px-2">{item.silence_duration?.toFixed(2)}s</td>
                                                                <td className="py-2 px-2 text-xs" dir="ltr">{item.silence_offset_hms || '-'}</td>
                                                                <td className="py-2 px-2">{item.speaker} → {item.next_speaker}</td>
                                                                <td className="py-2 px-2 text-xs max-w-xs truncate">{item.podcast_id}</td>
                                                                <td className="py-2 px-2">
                                                                    {item.audio_url ? (
                                                                        <span className="text-green-600">✓</span>
                                                                    ) : (
                                                                        <span className="text-gray-400">-</span>
                                                                    )}
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <div className="flex gap-1">
                                                                        <button
                                                                            onClick={() => startEditDataItem(item)}
                                                                            className="p-1 text-blue-600 hover:bg-blue-100 rounded"
                                                                            title="ערוך"
                                                                        >
                                                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                                            </svg>
                                                                        </button>
                                                                        <button
                                                                            onClick={() => deleteDataItem(item.id)}
                                                                            className="p-1 text-red-500 hover:bg-red-100 rounded"
                                                                            title="מחק"
                                                                        >
                                                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                                            </svg>
                                                                        </button>
                                                                        <button
                                                                            onClick={() => { setCurrentIndex(dataset.indexOf(item)); setActiveTab('tagging'); }}
                                                                            className="p-1 text-green-600 hover:bg-green-100 rounded"
                                                                            title="עבור לתיוג"
                                                                        >
                                                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                                                            </svg>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </>
                                                        )}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Transcriptions Management Tab - Admin only */}
                        {activeTab === 'transcriptions' && isAdmin && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* API Configuration */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800 flex items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-blue-600">
                                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                            <line x1="12" y1="19" x2="12" y2="22"></line>
                                        </svg>
                                        AssemblyAI API
                                    </h2>
                                    
                                    <div className="space-y-4">
                                        <div className={`p-4 rounded-lg ${ASSEMBLYAI_API_KEY ? 'bg-green-50 border border-green-200' : 'bg-orange-50 border border-orange-200'}`}>
                                            <div className="flex items-center gap-2 mb-2">
                                                <div className={`w-3 h-3 rounded-full ${ASSEMBLYAI_API_KEY ? 'bg-green-500' : 'bg-orange-500'}`}></div>
                                                <span className={`font-medium ${ASSEMBLYAI_API_KEY ? 'text-green-700' : 'text-orange-700'}`}>
                                                    {ASSEMBLYAI_API_KEY ? 'מפתח API מוגדר' : 'מפתח API לא מוגדר'}
                                                </span>
                                            </div>
                                            {!ASSEMBLYAI_API_KEY && (
                                                <div className="text-sm text-orange-600 space-y-2">
                                                    <p>להפעלת סנכרון מדויק:</p>
                                                    <ol className="list-decimal list-inside space-y-1 text-xs">
                                                        <li>הרשם ב-<a href="https://www.assemblyai.com/dashboard/signup" target="_blank" className="underline">AssemblyAI</a> (חינם!)</li>
                                                        <li>העתק את מפתח ה-API</li>
                                                        <li>הוסף אותו בקוד (ASSEMBLYAI_API_KEY)</li>
                                                    </ol>
                                                    <p className="mt-2 text-green-600 font-medium">✨ 185 שעות תעתוק בחינם!</p>
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="text-sm text-gray-600">
                                            <h3 className="font-medium text-gray-800 mb-2">מה זה נותן?</h3>
                                            <ul className="space-y-1">
                                                <li>✅ סנכרון כתוביות מדויק לאודיו</li>
                                                <li>✅ תמיכה בעברית</li>
                                                <li>✅ Word-level timestamps</li>
                                                <li>✅ שמירה אוטומטית ב-Firebase</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>

                                {/* Transcription Stats */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">סטטיסטיקות תעתוק</h2>
                                    
                                    {(() => {
                                        const percentage = transcriptionStats.total > 0 
                                            ? Math.round((transcriptionStats.withTranscription / transcriptionStats.total) * 100) 
                                            : 0;
                                        
                                        return (
                                            <>
                                                <div className="grid grid-cols-2 gap-4 mb-4">
                                                    <div className="bg-blue-50 rounded-lg p-4 text-center">
                                                        <div className="text-3xl font-bold text-blue-600">{transcriptionStats.withTranscription}</div>
                                                        <div className="text-sm text-gray-600">פריטים מתועתקים</div>
                                                    </div>
                                                    <div className="bg-gray-50 rounded-lg p-4 text-center">
                                                        <div className="text-3xl font-bold text-gray-600">{transcriptionStats.total - transcriptionStats.withTranscription}</div>
                                                        <div className="text-sm text-gray-600">ממתינים לתעתוק</div>
                                                    </div>
                                                </div>
                                                
                                                <div className="mb-2">
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="text-gray-600">התקדמות</span>
                                                        <span className="font-medium">{percentage}%</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                                        <div 
                                                            className="bg-blue-600 h-2 rounded-full transition-all"
                                                            style={{ width: `${percentage}%` }}
                                                        ></div>
                                                    </div>
                                                </div>
                                            </>
                                        );
                                    })()}
                                </div>

                                {/* Batch Transcription - Now integrated with data loading */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">תעתוק כל הדאטא</h2>
                                    
                                    {ASSEMBLYAI_API_KEY ? (
                                        <div className="space-y-4">
                                            <p className="text-sm text-gray-600">
                                                תעתק את כל הפריטים שעדיין לא תועתקו. התהליך רץ ברקע ושומר ל-Firebase.
                                            </p>
                                            
                                            <div className="space-y-2">
                                                <button
                                                    onClick={async () => {
                                                        if (!confirm('האם להתחיל תעתוק של כל הפריטים? זה יכול לקחת זמן.')) return;
                                                        
                                                        // Get already transcribed items
                                                        let transcribedIds = new Set();
                                                        if (window.firebaseEnabled && window.database) {
                                                            const snapshot = await window.database.ref('transcriptions').once('value');
                                                            const data = snapshot.val();
                                                            if (data) transcribedIds = new Set(Object.keys(data));
                                                        }
                                                        
                                                        const itemsToTranscribe = dataset.filter(d => d.audio_url && !transcribedIds.has(d.id));
                                                        let completed = 0;
                                                        
                                                        for (const item of itemsToTranscribe) {
                                                            await transcribeWithAssemblyAI(item.audio_url, item.id);
                                                            completed++;
                                                            console.log(`Transcribed ${completed}/${itemsToTranscribe.length}`);
                                                        }
                                                        
                                                        alert(`סיימנו לתעתק ${completed} פריטים!`);
                                                    }}
                                                    disabled={isTranscribing}
                                                    className="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition"
                                                >
                                                    {isTranscribing ? 'מתעתק...' : '🎯 תעתק את כל הפריטים החסרים'}
                                                </button>
                                            </div>
                                            
                                            <div className="p-3 bg-blue-50 rounded-lg">
                                                <p className="text-xs text-blue-700">
                                                    💡 <strong>טיפ:</strong> לאחר התעתוק, המשתמשים יראו סנכרון מדויק אוטומטית - בלי צורך בלחיצה!
                                                </p>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-8 text-gray-500">
                                            <p>הגדר מפתח API כדי להפעיל תעתוק</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PodcastTaggingApp />);
    </script>
</body>
</html>
