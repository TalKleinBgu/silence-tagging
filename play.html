        databaseURL: "https://silence-classification-default-rtdb.firebaseio.com",
        projectId: "silence-classification",

        appId: "1:1068855370524:web:d11bd704ef15b16eb5d0d9",
        measurementId: "G-MG35JDCFDZ"
        };

        // Initialize Firebase only if configured
        let database = null;
        let firebaseEnabled = false;
        
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseEnabled = true;

                console.error('Firebase initialization error:', error);

        } else {
            console.log('Firebase not configured - using local storage only');

        // Make available globally for React
        window.database = database;
        window.firebaseEnabled = firebaseEnabled;
    </script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons as simple SVG components
        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        const PauseIcon = () => (

        const SkipForwardIcon = () => (

                <polygon points="5 4 15 12 5 20 5 4"></polygon>

        const SkipBackIcon = () => (

                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
        );

        const UsersIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const SaveIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        );

        const ChartIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
        );

        const DownloadIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const AlertCircleIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const DEFAULT_CATEGORIES = [
            'Embarrassment',
            'Dramatic',
            'Surprise',
            'Excitement',
            'Topic change',
            'Sadness',
            'Processing'
        ];

        // Admin users list - add usernames here
        const ADMIN_USERS = ['טל', 'זיו', 'אליה', 'admin',"רובי"];

        const PodcastTaggingApp = () => {
            const [username, setUsername] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedTags, setSelectedTags] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [allTags, setAllTags] = useState({});
            const [loading, setLoading] = useState(true);
            const [dataset, setDataset] = useState([]);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('tagging');
            const [syncStatus, setSyncStatus] = useState('local'); // 'local', 'syncing', 'synced', 'error'
            const [lastSync, setLastSync] = useState(null);
            const [registeredUsers, setRegisteredUsers] = useState({}); // {username: {categories: [...], isAdmin: false, assignedItems: []}}
            const [newUserName, setNewUserName] = useState('');
            const [newUserCategories, setNewUserCategories] = useState([]);
            const [newUserIsAdmin, setNewUserIsAdmin] = useState(false);
            const [newUserItemsStart, setNewUserItemsStart] = useState('');
            const [newUserItemsEnd, setNewUserItemsEnd] = useState('');
            const [editingUserItems, setEditingUserItems] = useState(null); // username being edited
            const [editingDataItem, setEditingDataItem] = useState(null); // data item being edited
            const [editingDataValues, setEditingDataValues] = useState({}); // values being edited
            const [dataSearchTerm, setDataSearchTerm] = useState('');
            const [importJsonText, setImportJsonText] = useState('');
            const [untaggedIndex, setUntaggedIndex] = useState(0); // Index within untagged items only
            const [categories, setCategories] = useState(DEFAULT_CATEGORIES); // Dynamic categories
            const [newCategoryName, setNewCategoryName] = useState('');
            const [tagsFilterUser, setTagsFilterUser] = useState(''); // Filter by user
            const [tagsFilterCategory, setTagsFilterCategory] = useState(''); // Filter by category
            const [tagsFilterPodcast, setTagsFilterPodcast] = useState(''); // Filter by podcast
            const [tagsFilterItemId, setTagsFilterItemId] = useState(''); // Filter by item ID
            const [tagsSearchTerm, setTagsSearchTerm] = useState(''); // Search in text
            const [editingItem, setEditingItem] = useState(null); // Item being edited (from My Progress)
            const audioRef = useRef(null);
            const fileInputRef = useRef(null);

            // Check if current user is admin
            const isAdmin = ADMIN_USERS.includes(username) || (registeredUsers[username]?.isAdmin);
            
            // Get allowed categories for current user
            const getAllowedCategories = () => {
                if (isAdmin) return categories;
                if (registeredUsers[username]) {
                    // Filter user's allowed categories to only include those that still exist
                    const userCats = registeredUsers[username].categories || categories;
                    return userCats.filter(cat => categories.includes(cat));
                }
                return categories; // Default to all categories for unregistered users
            };
            
            const allowedCategories = getAllowedCategories();

            // Get allowed items for current user
            const getAllowedItems = () => {
                if (isAdmin) return dataset;
                if (registeredUsers[username]?.assignedItems && registeredUsers[username].assignedItems.length > 0) {
                    return dataset.filter((_, index) => 
                        registeredUsers[username].assignedItems.includes(index)
                    );
                }
                return dataset; // Default to all items
            };
            
            const allowedDataset = getAllowedItems();

            // Get user's progress - what's tagged and what's not
            const getUserProgress = () => {
                const tagged = [];
                const untagged = [];
                
                allowedDataset.forEach((item, idx) => {
                    const itemTags = allTags[item.id] || [];
                    const userTagged = itemTags.find(t => t.username === username);
                    if (userTagged) {
                        tagged.push({ ...item, originalIndex: idx, userTags: userTagged.tags, timestamp: userTagged.timestamp });
                    } else {
                        untagged.push({ ...item, originalIndex: idx });
                    }
                });
                
                return { tagged, untagged, total: allowedDataset.length };
            };

            // Get only untagged items for the tagging tab
            const getUntaggedItems = () => {
                return allowedDataset.filter(item => {
                    const itemTags = allTags[item.id] || [];
                    return !itemTags.some(t => t.username === username);
                });
            };

            // Load dataset and tags from storage
            useEffect(() => {
                loadData();
            }, []);

            // Subscribe to Firebase changes
            useEffect(() => {
                console.log('Firebase check - enabled:', window.firebaseEnabled, 'database:', !!window.database);
                
                if (!window.firebaseEnabled || !window.database) {
                    console.log('Firebase not available, staying in local mode');
                    return;
                }
                
                console.log('Connecting to Firebase...');
                setSyncStatus('syncing');
                
                const tagsRef = window.database.ref('podcast-tags');
                
                const unsubscribe = tagsRef.on('value', (snapshot) => {
                    console.log('Firebase data received:', snapshot.val());
                    const data = snapshot.val();
                    if (data) {
                        setAllTags(data);
                        // Also save to localStorage as backup
                        localStorage.setItem('podcast-tags', JSON.stringify(data));
                    }
                    setLastSync(new Date());
                    setSyncStatus('synced');
                }, (error) => {
                    console.error('Firebase sync error:', error);
                    setSyncStatus('error');
                });
                
                return () => tagsRef.off('value', unsubscribe);
            }, []);

            // Subscribe to Firebase for registered users
            useEffect(() => {
                if (!window.firebaseEnabled || !window.database) return;
                
                const usersRef = window.database.ref('registered-users');
                
                const unsubscribe = usersRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setRegisteredUsers(data);
                        localStorage.setItem('registered-users', JSON.stringify(data));
                    }
                });
                
                return () => usersRef.off('value', unsubscribe);
            }, []);

            // Subscribe to Firebase for categories
            useEffect(() => {
                if (!window.firebaseEnabled || !window.database) return;
                
                const categoriesRef = window.database.ref('categories');
                
                const unsubscribe = categoriesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && Array.isArray(data)) {
                        setCategories(data);
                        localStorage.setItem('categories', JSON.stringify(data));
                    }
                });
                
                return () => categoriesRef.off('value', unsubscribe);
            }, []);

            // Load categories on startup
            useEffect(() => {
                const loadCategories = async () => {
                    if (window.firebaseEnabled && window.database) {
                        try {
                            const snapshot = await window.database.ref('categories').once('value');
                            const data = snapshot.val();
                            if (data && Array.isArray(data)) {
                                setCategories(data);
                            } else {
                                // Initialize with default categories if none exist
                                await window.database.ref('categories').set(DEFAULT_CATEGORIES);
                            }
                        } catch (error) {
                            console.error('Error loading categories:', error);
                        }
                    } else {
                        const saved = localStorage.getItem('categories');
                        if (saved) setCategories(JSON.parse(saved));
                    }
                };
                loadCategories();
            }, []);

            // Save categories
            const saveCategories = async (cats) => {
                localStorage.setItem('categories', JSON.stringify(cats));
                if (window.firebaseEnabled && window.database) {
                    try {
                        await window.database.ref('categories').set(cats);
                    } catch (error) {
                        console.error('Error saving categories:', error);
                    }
                }
            };

            // Add new category
            const addCategory = async () => {
                const trimmedName = newCategoryName.trim();
                if (!trimmedName) return;
                if (categories.includes(trimmedName)) {
                    alert('קטגוריה זו כבר קיימת');
                    return;
                }
                
                const updatedCategories = [...categories, trimmedName];
                await saveCategories(updatedCategories);
                setCategories(updatedCategories);
                setNewCategoryName('');
            };

            // Delete category
            const deleteCategory = async (categoryToDelete) => {
                if (!confirm(`האם למחוק את הקטגוריה "${categoryToDelete}"? התיוגים הקיימים לא יימחקו.`)) return;
                
                const updatedCategories = categories.filter(cat => cat !== categoryToDelete);
                await saveCategories(updatedCategories);
                setCategories(updatedCategories);
            };

            // Reset categories to default
            const resetCategoriesToDefault = async () => {
                if (!confirm('האם לאפס את הקטגוריות לברירת המחדל?')) return;
                
                await saveCategories(DEFAULT_CATEGORIES);
                setCategories(DEFAULT_CATEGORIES);
            };

            // Load registered users on startup
            useEffect(() => {
                const loadUsers = async () => {
                    if (window.firebaseEnabled && window.database) {
                        try {
                            const snapshot = await window.database.ref('registered-users').once('value');
                            const data = snapshot.val();
                            if (data) setRegisteredUsers(data);
                        } catch (error) {
                            console.error('Error loading users:', error);
                        }
                    } else {
                        const saved = localStorage.getItem('registered-users');
                        if (saved) setRegisteredUsers(JSON.parse(saved));
                    }
                };
                loadUsers();
            }, []);

            // Save registered users
            const saveRegisteredUsers = async (users) => {
                localStorage.setItem('registered-users', JSON.stringify(users));
                if (window.firebaseEnabled && window.database) {
                    try {
                        await window.database.ref('registered-users').set(users);
                    } catch (error) {
                        console.error('Error saving users:', error);
                    }
                }
            };

            // Add new user
            const addUser = async () => {
                if (!newUserName.trim()) return;
                if (newUserCategories.length === 0) {
                    alert('יש לבחור לפחות קטגוריה אחת');
                    return;
                }
                
                // Parse item range
                let assignedItems = [];
                const start = parseInt(newUserItemsStart);
                const end = parseInt(newUserItemsEnd);
                if (!isNaN(start) && !isNaN(end) && start >= 1 && end >= start) {
                    for (let i = start - 1; i < end && i < dataset.length; i++) {
                        assignedItems.push(i);
                    }
                }
                
                const updatedUsers = {
                    ...registeredUsers,
                    [newUserName.trim()]: {
                        categories: newUserCategories,
                        isAdmin: newUserIsAdmin,
                        assignedItems: assignedItems,
                        createdAt: new Date().toISOString()
                    }
                };
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
                setNewUserName('');
                setNewUserCategories([]);
                setNewUserIsAdmin(false);
                setNewUserItemsStart('');
                setNewUserItemsEnd('');
            };

            // Delete user
            const deleteUser = async (userToDelete) => {
                if (!confirm(`האם למחוק את המשתמש ${userToDelete}?`)) return;
                
                const updatedUsers = { ...registeredUsers };
                delete updatedUsers[userToDelete];
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
            };

            // Update user categories
            const updateUserCategories = async (userToUpdate, newCategories) => {
                const updatedUsers = {
                    ...registeredUsers,
                    [userToUpdate]: {
                        ...registeredUsers[userToUpdate],
                        categories: newCategories
                    }
                };
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
            };

            // Update user assigned items
            const updateUserItems = async (userToUpdate, startItem, endItem) => {
                let assignedItems = [];
                const start = parseInt(startItem);
                const end = parseInt(endItem);
                if (!isNaN(start) && !isNaN(end) && start >= 1 && end >= start) {
                    for (let i = start - 1; i < end && i < dataset.length; i++) {
                        assignedItems.push(i);
                    }
                }
                
                const updatedUsers = {
                    ...registeredUsers,
                    [userToUpdate]: {
                        ...registeredUsers[userToUpdate],
                        assignedItems: assignedItems
                    }
                };
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
                setEditingUserItems(null);
            };

            // Toggle new user category
            const toggleNewUserCategory = (category) => {
                setNewUserCategories(prev =>
                    prev.includes(category)
                        ? prev.filter(c => c !== category)
                        : [...prev, category]
                );
            };

            // Save tags to Firebase and localStorage
            const saveTagsToStorage = async (tags) => {
                // Always save to localStorage
                localStorage.setItem('podcast-tags', JSON.stringify(tags));
                
                // Try to save to Firebase if enabled
                if (window.firebaseEnabled && window.database) {
                    setSyncStatus('syncing');
                    try {
                        await window.database.ref('podcast-tags').set(tags);
                        setSyncStatus('synced');
                        setLastSync(new Date());
                    } catch (error) {
                        console.error('Error saving to Firebase:', error);
                        setSyncStatus('error');
                    }
                }
            };

            // Load tags from Firebase or localStorage
            const loadTagsFromStorage = async () => {
                if (window.firebaseEnabled && window.database) {
                    try {
                        const snapshot = await window.database.ref('podcast-tags').once('value');
                        const data = snapshot.val();
                        if (data) {
                            setSyncStatus('synced');
                            setLastSync(new Date());
                            return data;
                        }
                    } catch (error) {
                        console.error('Error loading from Firebase:', error);
                        setSyncStatus('error');
                    }
                }
                
                // Fallback to localStorage
                const savedTags = localStorage.getItem('podcast-tags');
                return savedTags ? JSON.parse(savedTags) : {};
            };

            // Save dataset to Firebase and localStorage
            const saveDatasetToStorage = async (data) => {
                localStorage.setItem('podcast-dataset', JSON.stringify(data));
                if (window.firebaseEnabled && window.database) {
                    try {
                        await window.database.ref('dataset').set(data);
                        console.log('Dataset saved to Firebase');
                    } catch (error) {
                        console.error('Error saving dataset to Firebase:', error);
                    }
                }
            };

            // Load dataset from Firebase or localStorage
            const loadDatasetFromStorage = async () => {
                if (window.firebaseEnabled && window.database) {
                    try {
                        const snapshot = await window.database.ref('dataset').once('value');
                        const data = snapshot.val();
                        if (data && Array.isArray(data) && data.length > 0) {
                            console.log('Dataset loaded from Firebase:', data.length, 'items');
                            return data;
                        }
                    } catch (error) {
                        console.error('Error loading dataset from Firebase:', error);
                    }
                }
                
                // Fallback to localStorage
                const savedDataset = localStorage.getItem('podcast-dataset');
                if (savedDataset) {
                    const data = JSON.parse(savedDataset);
                    if (data && Array.isArray(data) && data.length > 0) {
                        console.log('Dataset loaded from localStorage:', data.length, 'items');
                        return data;
                    }
                }
                return null;
            };

            // Fetch dataset from HuggingFace
            const fetchFromHuggingFace = async () => {
                let apiUrl = 'https://datasets-server.huggingface.co/rows?dataset=Zivf/silence-hebrew-multispeaker&config=default&split=train&offset=0&length=100';
                
                console.log('Fetching from HuggingFace:', apiUrl);
                let response = await fetch(apiUrl);
                
                if (!response.ok) {
                    // Try alternative API endpoint
                    apiUrl = 'https://datasets-server.huggingface.co/first-rows?dataset=Zivf/silence-hebrew-multispeaker&config=default&split=train';
                    console.log('Trying alternative endpoint:', apiUrl);
                    response = await fetch(apiUrl);
                }
                
                if (!response.ok) {
                    throw new Error(`לא ניתן לטעון דאטא מ-HuggingFace (${response.status})`);
                }
                
                const data = await response.json();
                console.log('Received data from HuggingFace:', data);
                
                // Handle different response formats
                const rows = data.rows || data.features || [];
                
                if (rows.length === 0) {
                    throw new Error('לא נמצאו שורות בדאטאסט');
                }
                
                // Transform the data to our format
                const transformedData = rows.map((item, index) => {
                    const row = item.row || item;
                    
                    // Handle audio path - it's an array with src property
                    let audioUrl = null;
                    if (row.audio_clip_path) {
                        if (Array.isArray(row.audio_clip_path) && row.audio_clip_path.length > 0) {
                            audioUrl = row.audio_clip_path[0].src || row.audio_clip_path[0];
                        } else if (typeof row.audio_clip_path === 'string') {
                            audioUrl = row.audio_clip_path;
                        } else if (row.audio_clip_path.src) {
                            audioUrl = row.audio_clip_path.src;
                        } else if (row.audio_clip_path.path) {
                            audioUrl = `https://huggingface.co/datasets/Zivf/silence-hebrew-multispeaker/resolve/main/${row.audio_clip_path.path}`;
                        }
                    }
                    
                    return {
                        id: `item_${row.id || index}`,
                        text_before: row.text || '',
                        silence_duration: row.silence_duration_sec || 0,
                        silence_offset_hms: row.silence_offset_hms || '',
                        text_after: row.next_text || '',
                        audio_url: audioUrl,
                        speaker: row.speaker || '',
                        next_speaker: row.next_speaker || '',
                        podcast_id: row.podcast_id || ''
                    };
                });
                
                return transformedData;
            };

            const loadData = async () => {
                try {
                    setError(null);
                    
                    // First, try to load from Firebase/localStorage
                    const savedDataset = await loadDatasetFromStorage();
                    
                    if (savedDataset) {
                        console.log('Using cached dataset');
                        setDataset(savedDataset);
                    } else {
                        // If no cached data, fetch from HuggingFace
                        console.log('No cached dataset, fetching from HuggingFace...');
                        const transformedData = await fetchFromHuggingFace();
                        
                        if (transformedData.length === 0) {
                            throw new Error('לא הצלחנו לעבד את הדאטא');
                        }
                        
                        setDataset(transformedData);
                        
                        // Save to Firebase for future use
                        await saveDatasetToStorage(transformedData);
                        console.log('Dataset cached for future use');
                    }

                categories.forEach(cat => categoryCount[cat] = 0);
                
                Object.values(allTags).forEach(itemTags => {
                    itemTags.forEach(entry => {
                        entry.tags.forEach(tag => {
                            if (categoryCount[tag] !== undefined) {
                                categoryCount[tag]++;
                            }
                        });
                    });
                });

                // User statistics
                const userStats = {};
                users.forEach(user => {
                    userStats[user] = {
                        totalTagged: 0,
                        categories: {}
                    };
                    categories.forEach(cat => userStats[user].categories[cat] = 0);
                });

                Object.values(allTags).forEach(itemTags => {
                    itemTags.forEach(entry => {
                        if (userStats[entry.username]) {
                            userStats[entry.username].totalTagged++;
                            entry.tags.forEach(tag => {
                                if (userStats[entry.username].categories[tag] !== undefined) {
                                    userStats[entry.username].categories[tag]++;
                                }
                            });

            // Export tags to JSON - flat format with all data

            // Import dataset from JSON
            const importDataset = async (jsonData) => {
                try {

                    if (!Array.isArray(data)) {
                        throw new Error('הדאטא חייב להיות מערך');
                    }
                    
                    // Validate and transform data
                    const validatedData = data.map((item, index) => ({
                        id: item.id || `imported_${index}`,
                        text_before: item.text_before || item.text || '',
                        text_after: item.text_after || item.next_text || '',

            // Handle file upload
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    if (file.name.endsWith('.csv')) {
                        // Parse CSV
                        const lines = content.split('\n');
                        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
                        const data = [];
                        
                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            // Simple CSV parsing (handles quoted fields)
                            const values = lines[i].match(/("([^"]*)")|([^,]+)/g) || [];
                            const item = {};
                            headers.forEach((header, idx) => {
                                let val = values[idx] || '';
                                val = val.replace(/^"|"$/g, '').replace(/""/g, '"');
                                item[header] = val;
                            });
                            data.push(item);
                        }
                        importDataset(data);
                    } else {
                        importDataset(content);
                    }
                };
                reader.readAsText(file);
                event.target.value = ''; // Reset input
            };

                                    <div className="flex flex-wrap gap-2">
                                        {ADMIN_USERS.map(admin => (
                                            <span key={admin} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm">
                                                {admin}
                                            </span>
                                        ))}
                                    </div>
                                    <p className="text-sm text-gray-500 mt-2">
                                        משתמשים אלו מוגדרים בקוד ותמיד יהיו מנהלים. לשינוי, יש לערוך את הקוד.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Category Management Tab - Admin only */}
                        {activeTab === 'categories' && isAdmin && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Add New Category */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">הוסף קטגוריה חדשה</h2>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">שם הקטגוריה (באנגלית)</label>
                                            <input
                                                type="text"
                                                value={newCategoryName}
                                                onChange={(e) => setNewCategoryName(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && addCategory()}
                                                placeholder="e.g. Hesitation"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                dir="ltr"
                                            />
                                        </div>
                                        
                                        <button
                                            onClick={addCategory}
                                            disabled={!newCategoryName.trim()}
                                            className="w-full py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition"
                                        >
                                            + הוסף קטגוריה
                                        </button>
                                    </div>
                                    
                                    <div className="mt-6 pt-4 border-t border-gray-200">
                                        <button
                                            onClick={resetCategoriesToDefault}
                                            className="w-full py-2 bg-orange-100 hover:bg-orange-200 text-orange-700 rounded-lg font-medium transition"
                                        >
                                            🔄 אפס לברירת מחדל
                                        </button>
                                        <p className="text-xs text-gray-500 mt-2 text-center">
                                            יחזיר את הקטגוריות לרשימת ברירת המחדל
                                        </p>
                                    </div>
                                </div>

                                {/* Existing Categories */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">קטגוריות קיימות ({categories.length})</h2>
                                    
                                    <div className="space-y-2 max-h-[500px] overflow-y-auto">
                                        {categories.map((category, index) => (
                                            <div key={category} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100">
                                                <div className="flex items-center gap-3">
                                                    <span className="text-sm text-gray-400 w-6">{index + 1}.</span>
                                                    <span className="font-medium text-gray-800">{category}</span>
                                                </div>
                                                <button
                                                    onClick={() => deleteCategory(category)}
                                                    className="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-700 rounded text-sm transition"
                                                >
                                                    מחק
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    {categories.length === 0 && (
                                        <div className="text-center text-gray-500 py-8">
                                            אין קטגוריות. הוסף קטגוריה חדשה או אפס לברירת מחדל.
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Data Management Tab - Admin only */}
                        {activeTab === 'data' && isAdmin && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Import Section */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">ייבוא דאטא</h2>
                                    
                                    {/* File Upload */}
                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">העלאת קובץ</label>
                                        <input
                                            ref={fileInputRef}
                                            type="file"
                                            accept=".json,.csv"
                                            onChange={handleFileUpload}
                                            className="hidden"
                                        />
                                        <button
                                            onClick={() => fileInputRef.current?.click()}
                                            className="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                                <polyline points="17 8 12 3 7 8"></polyline>
                                                <line x1="12" y1="3" x2="12" y2="15"></line>
                                            </svg>
                                            בחר קובץ (JSON/CSV)
                                        </button>
                                    </div>
                                    
                                    {/* JSON Paste */}
                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">או הדבק JSON</label>
                                        <textarea
                                            value={importJsonText}
                                            onChange={(e) => setImportJsonText(e.target.value)}
                                            placeholder='[{"id": "1", "text_before": "...", "text_after": "...", "silence_duration": 2.5}]'
                                            className="w-full h-32 px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono resize-none"
                                            dir="ltr"
                                        />
                                        <button
                                            onClick={() => importDataset(importJsonText)}
                                            disabled={!importJsonText.trim()}
                                            className="w-full mt-2 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition"
                                        >
                                            ייבא מ-JSON
                                        </button>
                                    </div>
                                    
                                    <div className="border-t pt-4">
                                        <p className="text-xs text-gray-500 mb-2">פורמט נתמך:</p>
                                        <pre className="text-xs bg-gray-100 p-2 rounded overflow-x-auto" dir="ltr">{`[{
  "id": "item_1",
  "text_before": "טקסט לפני",
  "text_after": "טקסט אחרי",
  "silence_duration": 2.5,
  "silence_offset_hms": "00:01:30",
  "speaker": "A",
  "podcast_id": "שם"
}]`}</pre>
                                    </div>
                                </div>

                                {/* Export Section */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">ייצוא דאטא</h2>
                                    
                                    <div className="space-y-3">
                                        <div className="p-4 bg-gray-50 rounded-lg">
                                            <div className="text-2xl font-bold text-blue-600">{dataset.length}</div>
                                            <div className="text-gray-600 text-sm">פריטים בדאטאסט</div>
                                        </div>
                                        
                                        <button
                                            onClick={exportDataset}
                                            className="w-full py-3 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition flex items-center justify-center gap-2"
                                        >
                                            <DownloadIcon />
                                            ייצא דאטאסט (JSON)
                                        </button>
                                        
                                        <button
                                            onClick={exportDatasetCSV}
                                            className="w-full py-3 bg-green-100 hover:bg-green-200 rounded-lg font-medium transition flex items-center justify-center gap-2"
                                        >
                                            <DownloadIcon />
                                            ייצא דאטאסט (CSV)
                                        </button>
                                    </div>
                                    
                                    <div className="mt-4 pt-4 border-t">
                                        <h3 className="font-medium text-gray-800 mb-2">הוסף פריט חדש</h3>
                                        <button
                                            onClick={addDataItem}
                                            className="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition"
                                        >
                                            + הוסף פריט
                                        </button>
                                    </div>
                                </div>

                                {/* Data Info */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">מידע על הדאטא</h2>
                                    
                                    <div className="space-y-3 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">סה"כ פריטים:</span>
                                            <span className="font-medium">{dataset.length}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">פריטים עם אודיו:</span>
                                            <span className="font-medium">{dataset.filter(d => d.audio_url).length}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">ממוצע שתיקה:</span>
                                            <span className="font-medium">
                                                {(dataset.reduce((sum, d) => sum + (d.silence_duration || 0), 0) / dataset.length).toFixed(2)}s
                                            </span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">דוברים ייחודיים:</span>
                                            <span className="font-medium">
                                                {new Set(dataset.map(d => d.speaker).filter(Boolean)).size}
                                            </span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">פודקאסטים:</span>
                                            <span className="font-medium">
                                                {new Set(dataset.map(d => d.podcast_id).filter(Boolean)).size}
                                            </span>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-4 pt-4 border-t space-y-2">
                                        <button
                                            onClick={async () => {
                                                if (!confirm('האם לטעון מחדש מ-HuggingFace? פעולה זו תחליף את הדאטא הקיים.')) return;
                                                setLoading(true);
                                                try {
                                                    const newData = await fetchFromHuggingFace();
                                                    setDataset(newData);
                                                    await saveDatasetToStorage(newData);
                                                    alert(`נטענו ${newData.length} פריטים מ-HuggingFace ונשמרו!`);
                                                } catch (err) {
                                                    alert('שגיאה בטעינה: ' + err.message);
                                                }
                                                setLoading(false);
                                            }}
                                            className="w-full py-2 bg-orange-100 hover:bg-orange-200 text-orange-700 rounded-lg font-medium transition"
                                        >
                                            🔄 טען מחדש מ-HuggingFace
                                        </button>
                                        <p className="text-xs text-gray-500 text-center">
                                            הדאטא נשמר ב-Firebase ונטען אוטומטית
                                        </p>
                                    </div>
                                </div>

                                {/* Data Table */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 lg:col-span-3">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-semibold text-gray-800">טבלת דאטא ({getFilteredDataset().length} פריטים)</h2>
                                        <input
                                            type="text"
                                            placeholder="חיפוש..."
                                            value={dataSearchTerm}
                                            onChange={(e) => setDataSearchTerm(e.target.value)}
                                            className="px-4 py-2 border border-gray-300 rounded-lg w-64"
                                        />
                                    </div>
                                    
                                    <div className="overflow-x-auto max-h-[500px] overflow-y-auto">
                                        <table className="w-full text-right text-sm">
                                            <thead className="sticky top-0 bg-white border-b">
                                                <tr>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">#</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">מזהה</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">טקסט לפני</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">טקסט אחרי</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">זמן השתיקה</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">הזמן באודיו</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">דובר</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">פודקאסט</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">אודיו</th>
                                                    <th className="pb-3 px-2 text-gray-600 font-medium">פעולות</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {getFilteredDataset().map((item, idx) => (
                                                    <tr key={item.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                        {editingDataItem === item.id ? (
                                                            // Edit mode
                                                            <>
                                                                <td className="py-2 px-2">{idx + 1}</td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.id}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, id: e.target.value})}
                                                                        className="w-24 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <textarea
                                                                        value={editingDataValues.text_before}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, text_before: e.target.value})}
                                                                        className="w-full px-1 py-0.5 border rounded text-xs h-16"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <textarea
                                                                        value={editingDataValues.text_after}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, text_after: e.target.value})}
                                                                        className="w-full px-1 py-0.5 border rounded text-xs h-16"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        type="number"
                                                                        step="0.01"
                                                                        value={editingDataValues.silence_duration}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, silence_duration: e.target.value})}
                                                                        className="w-16 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.silence_offset_hms || ''}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, silence_offset_hms: e.target.value})}
                                                                        className="w-20 px-1 py-0.5 border rounded text-xs"
                                                                        placeholder="00:00:00"
                                                                        dir="ltr"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.speaker}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, speaker: e.target.value})}
                                                                        className="w-12 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                    →
                                                                    <input
                                                                        value={editingDataValues.next_speaker}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, next_speaker: e.target.value})}
                                                                        className="w-12 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.podcast_id}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, podcast_id: e.target.value})}
                                                                        className="w-24 px-1 py-0.5 border rounded text-xs"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <input
                                                                        value={editingDataValues.audio_url || ''}
                                                                        onChange={(e) => setEditingDataValues({...editingDataValues, audio_url: e.target.value})}
                                                                        className="w-24 px-1 py-0.5 border rounded text-xs"
                                                                        placeholder="URL"
                                                                    />
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <div className="flex gap-1">
                                                                        <button
                                                                            onClick={saveEditDataItem}
                                                                            className="px-2 py-1 bg-green-500 text-white rounded text-xs"
                                                                        >
                                                                            שמור
                                                                        </button>
                                                                        <button
                                                                            onClick={cancelEditDataItem}
                                                                            className="px-2 py-1 bg-gray-300 rounded text-xs"
                                                                        >
                                                                            ביטול
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </>
                                                        ) : (
                                                            // View mode
                                                            <>
                                                                <td className="py-2 px-2 text-gray-500">{idx + 1}</td>
                                                                <td className="py-2 px-2 text-xs text-gray-500">{item.id}</td>
                                                                <td className="py-2 px-2 max-w-xs">
                                                                    <div className="truncate" title={item.text_before}>
                                                                        {item.text_before.substring(0, 40)}...
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 px-2 max-w-xs">
                                                                    <div className="truncate" title={item.text_after}>
                                                                        {item.text_after.substring(0, 40)}...
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 px-2">{item.silence_duration?.toFixed(2)}s</td>
                                                                <td className="py-2 px-2 text-xs" dir="ltr">{item.silence_offset_hms || '-'}</td>
                                                                <td className="py-2 px-2">{item.speaker} → {item.next_speaker}</td>
                                                                <td className="py-2 px-2 text-xs max-w-xs truncate">{item.podcast_id}</td>
                                                                <td className="py-2 px-2">
                                                                    {item.audio_url ? (
                                                                        <span className="text-green-600">✓</span>
                                                                    ) : (
                                                                        <span className="text-gray-400">-</span>
                                                                    )}
                                                                </td>
                                                                <td className="py-2 px-2">
                                                                    <div className="flex gap-1">
                                                                        <button
                                                                            onClick={() => startEditDataItem(item)}
                                                                            className="p-1 text-blue-600 hover:bg-blue-100 rounded"
                                                                            title="ערוך"
                                                                        >
                                                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                                            </svg>
                                                                        </button>
                                                                        <button
                                                                            onClick={() => deleteDataItem(item.id)}
                                                                            className="p-1 text-red-500 hover:bg-red-100 rounded"
                                                                            title="מחק"
                                                                        >
                                                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                                            </svg>
                                                                        </button>
                                                                        <button
                                                                            onClick={() => { setCurrentIndex(dataset.indexOf(item)); setActiveTab('tagging'); }}
                                                                            className="p-1 text-green-600 hover:bg-green-100 rounded"
                                                                            title="עבור לתיוג"
                                                                        >
                                                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                                                            </svg>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </>
                                                        )}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PodcastTaggingApp />);
    </script>
</body>
</html>
