        const firebaseConfig = {
        apiKey: "AIzaSyDIXMrzGcaJ1lJ2Zv3kN2h2o9IuvGfyHK8",
        authDomain: "silence-classification.firebaseapp.com",
        databaseURL: "https://silence-classification-default-rtdb.firebaseio.com",
        projectId: "silence-classification",
        storageBucket: "silence-classification.firebasestorage.app",
        messagingSenderId: "1068855370524",
        appId: "1:1068855370524:web:d11bd704ef15b16eb5d0d9",
        measurementId: "G-MG35JDCFDZ"
        };

        // Initialize Firebase only if configured
        let database = null;
        let firebaseEnabled = false;
        
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseEnabled = true;
                console.log('Firebase initialized successfully');
            } catch (error) {
                console.error('Firebase initialization error:', error);
            }
        } else {
            console.log('Firebase not configured - using local storage only');
        }
        
        // Make available globally for React
        window.database = database;
        window.firebaseEnabled = firebaseEnabled;
    </script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons as simple SVG components
        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const PauseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>

        const SkipForwardIcon = () => (

                <polygon points="5 4 15 12 5 20 5 4"></polygon>

        );

        const SkipBackIcon = () => (

                <polygon points="19 20 9 12 19 4 19 20"></polygon>

        );

        const UsersIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const SaveIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        );

        const ChartIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
        );

        const DownloadIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const AlertCircleIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const CATEGORIES = [
            'Embarrassment',
            'Dramatic',
            'Surprise',
            'Excitement',
            'Topic change',
            'Sadness'
        ];

        // Admin users list - add usernames here
        const ADMIN_USERS = ['טל', 'tal', 'Tal', 'admin'];

        const PodcastTaggingApp = () => {
            const [username, setUsername] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedTags, setSelectedTags] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [allTags, setAllTags] = useState({});
            const [loading, setLoading] = useState(true);
            const [dataset, setDataset] = useState([]);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('tagging');
            const [selectedUser, setSelectedUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('local'); // 'local', 'syncing', 'synced', 'error'
            const [lastSync, setLastSync] = useState(null);
            const [registeredUsers, setRegisteredUsers] = useState({}); // {username: {categories: [...], isAdmin: false, assignedItems: []}}
            const [newUserName, setNewUserName] = useState('');
            const [newUserCategories, setNewUserCategories] = useState([]);
            const [newUserIsAdmin, setNewUserIsAdmin] = useState(false);
            const [newUserItemsStart, setNewUserItemsStart] = useState('');
            const [newUserItemsEnd, setNewUserItemsEnd] = useState('');
            const [editingUserItems, setEditingUserItems] = useState(null); // username being edited
            const audioRef = useRef(null);

            // Check if current user is admin
            const isAdmin = ADMIN_USERS.includes(username) || (registeredUsers[username]?.isAdmin);
            
            // Get allowed categories for current user
            const getAllowedCategories = () => {
                if (isAdmin) return CATEGORIES;
                if (registeredUsers[username]) {
                    return registeredUsers[username].categories || CATEGORIES;
                }
                return CATEGORIES; // Default to all categories for unregistered users
            };
            
            const allowedCategories = getAllowedCategories();

            // Get allowed items for current user
            const getAllowedItems = () => {
                if (isAdmin) return dataset;
                if (registeredUsers[username]?.assignedItems && registeredUsers[username].assignedItems.length > 0) {
                    return dataset.filter((_, index) => 
                        registeredUsers[username].assignedItems.includes(index)
                    );
                }
                return dataset; // Default to all items
            };
            
            const allowedDataset = getAllowedItems();

            // Load dataset and tags from storage
            useEffect(() => {
                loadData();
            }, []);

            // Subscribe to Firebase changes
            useEffect(() => {
                console.log('Firebase check - enabled:', window.firebaseEnabled, 'database:', !!window.database);
                
                if (!window.firebaseEnabled || !window.database) {
                    console.log('Firebase not available, staying in local mode');
                    return;
                }
                
                console.log('Connecting to Firebase...');
                setSyncStatus('syncing');
                
                const tagsRef = window.database.ref('podcast-tags');
                
                const unsubscribe = tagsRef.on('value', (snapshot) => {
                    console.log('Firebase data received:', snapshot.val());
                    const data = snapshot.val();
                    if (data) {
                        setAllTags(data);
                        // Also save to localStorage as backup
                        localStorage.setItem('podcast-tags', JSON.stringify(data));
                    }
                    setLastSync(new Date());
                    setSyncStatus('synced');
                }, (error) => {
                    console.error('Firebase sync error:', error);
                    setSyncStatus('error');
                });
                
                return () => tagsRef.off('value', unsubscribe);
            }, []);

            // Subscribe to Firebase for registered users
            useEffect(() => {
                if (!window.firebaseEnabled || !window.database) return;
                
                const usersRef = window.database.ref('registered-users');
                
                const unsubscribe = usersRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setRegisteredUsers(data);
                        localStorage.setItem('registered-users', JSON.stringify(data));
                    }
                });
                
                return () => usersRef.off('value', unsubscribe);
            }, []);

            // Load registered users on startup
            useEffect(() => {
                const loadUsers = async () => {
                    if (window.firebaseEnabled && window.database) {
                        try {
                            const snapshot = await window.database.ref('registered-users').once('value');
                            const data = snapshot.val();
                            if (data) setRegisteredUsers(data);
                        } catch (error) {
                            console.error('Error loading users:', error);
                        }
                    } else {
                        const saved = localStorage.getItem('registered-users');
                        if (saved) setRegisteredUsers(JSON.parse(saved));
                    }
                };
                loadUsers();
            }, []);

            // Save registered users
            const saveRegisteredUsers = async (users) => {
                localStorage.setItem('registered-users', JSON.stringify(users));
                if (window.firebaseEnabled && window.database) {
                    try {
                        await window.database.ref('registered-users').set(users);
                    } catch (error) {
                        console.error('Error saving users:', error);
                    }
                }
            };

            // Add new user
            const addUser = async () => {
                if (!newUserName.trim()) return;
                if (newUserCategories.length === 0) {
                    alert('יש לבחור לפחות קטגוריה אחת');
                    return;
                }
                
                // Parse item range
                let assignedItems = [];
                const start = parseInt(newUserItemsStart);
                const end = parseInt(newUserItemsEnd);
                if (!isNaN(start) && !isNaN(end) && start >= 1 && end >= start) {
                    for (let i = start - 1; i < end && i < dataset.length; i++) {
                        assignedItems.push(i);
                    }
                }
                
                const updatedUsers = {
                    ...registeredUsers,
                    [newUserName.trim()]: {
                        categories: newUserCategories,
                        isAdmin: newUserIsAdmin,
                        assignedItems: assignedItems,
                        createdAt: new Date().toISOString()
                    }
                };
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
                setNewUserName('');
                setNewUserCategories([]);
                setNewUserIsAdmin(false);
                setNewUserItemsStart('');
                setNewUserItemsEnd('');
            };

            // Delete user
            const deleteUser = async (userToDelete) => {
                if (!confirm(`האם למחוק את המשתמש ${userToDelete}?`)) return;
                
                const updatedUsers = { ...registeredUsers };
                delete updatedUsers[userToDelete];
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
            };

            // Update user categories
            const updateUserCategories = async (userToUpdate, newCategories) => {
                const updatedUsers = {
                    ...registeredUsers,
                    [userToUpdate]: {
                        ...registeredUsers[userToUpdate],
                        categories: newCategories
                    }
                };
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
            };

            // Update user assigned items
            const updateUserItems = async (userToUpdate, startItem, endItem) => {
                let assignedItems = [];
                const start = parseInt(startItem);
                const end = parseInt(endItem);
                if (!isNaN(start) && !isNaN(end) && start >= 1 && end >= start) {
                    for (let i = start - 1; i < end && i < dataset.length; i++) {
                        assignedItems.push(i);
                    }
                }
                
                const updatedUsers = {
                    ...registeredUsers,
                    [userToUpdate]: {
                        ...registeredUsers[userToUpdate],
                        assignedItems: assignedItems
                    }
                };
                
                await saveRegisteredUsers(updatedUsers);
                setRegisteredUsers(updatedUsers);
                setEditingUserItems(null);
            };

            // Toggle new user category
            const toggleNewUserCategory = (category) => {
                setNewUserCategories(prev =>
                    prev.includes(category)
                        ? prev.filter(c => c !== category)
                        : [...prev, category]
                );
            };

            // Save tags to Firebase and localStorage
            const saveTagsToStorage = async (tags) => {
                // Always save to localStorage
                localStorage.setItem('podcast-tags', JSON.stringify(tags));
                
                // Try to save to Firebase if enabled
                if (window.firebaseEnabled && window.database) {
                    setSyncStatus('syncing');
                    try {
                        await window.database.ref('podcast-tags').set(tags);
                        setSyncStatus('synced');
                        setLastSync(new Date());
                    } catch (error) {
                        console.error('Error saving to Firebase:', error);
                        setSyncStatus('error');
                    }
                }
            };

            // Load tags from Firebase or localStorage
            const loadTagsFromStorage = async () => {
                if (window.firebaseEnabled && window.database) {
                    try {
                        const snapshot = await window.database.ref('podcast-tags').once('value');
                        const data = snapshot.val();
                        if (data) {
                            setSyncStatus('synced');
                            setLastSync(new Date());
                            return data;
                        }
                    } catch (error) {
                        console.error('Error loading from Firebase:', error);
                        setSyncStatus('error');
                    }
                }
                
                // Fallback to localStorage
                const savedTags = localStorage.getItem('podcast-tags');
                return savedTags ? JSON.parse(savedTags) : {};
            };

            const loadData = async () => {
                try {
                    setError(null);
                    
                    // Try HuggingFace datasets viewer API
                    let apiUrl = 'https://datasets-server.huggingface.co/rows?dataset=Zivf/silence-hebrew-multispeaker&config=default&split=train&offset=0&length=100';
                    
                    console.log('Fetching from:', apiUrl);
                    let response = await fetch(apiUrl);
                    
                    if (!response.ok) {
                        // Try alternative API endpoint
                        apiUrl = 'https://datasets-server.huggingface.co/first-rows?dataset=Zivf/silence-hebrew-multispeaker&config=default&split=train';
                        console.log('Trying alternative endpoint:', apiUrl);
                        response = await fetch(apiUrl);
                    }
                    
                    if (!response.ok) {
                        throw new Error(`לא ניתן לטעון דאטא מ-HuggingFace (${response.status})`);
                    }
                    
                    const data = await response.json();
                    console.log('Received data:', data);
                    
                    // Handle different response formats
                    const rows = data.rows || data.features || [];
                    
                    if (rows.length === 0) {
                        throw new Error('לא נמצאו שורות בדאטאסט');
                    }
                    
                    // Transform the data to our format
                    const transformedData = rows.map((item, index) => {
                        const row = item.row || item;
                        
                        // Handle audio path - it's an array with src property
                        let audioUrl = null;
                        if (row.audio_clip_path) {
                            if (Array.isArray(row.audio_clip_path) && row.audio_clip_path.length > 0) {
                                // Audio is in array format with src property
                                audioUrl = row.audio_clip_path[0].src || row.audio_clip_path[0];
                            } else if (typeof row.audio_clip_path === 'string') {
                                audioUrl = row.audio_clip_path;
                            } else if (row.audio_clip_path.src) {
                                audioUrl = row.audio_clip_path.src;
                            } else if (row.audio_clip_path.path) {
                                audioUrl = `https://huggingface.co/datasets/Zivf/silence-hebrew-multispeaker/resolve/main/${row.audio_clip_path.path}`;
                            }
                        }
                        
                        console.log(`Item ${index} audio URL:`, audioUrl);
                        
                        return {
                            id: `item_${row.id || index}`,
                            text_before: row.text || '',
                            silence_duration: row.silence_duration_sec || 0,
                            text_after: row.next_text || '',
                            audio_url: audioUrl,
                            speaker: row.speaker || '',
                            next_speaker: row.next_speaker || '',
                            podcast_id: row.podcast_id || ''
                        };
                    });
                    
                    console.log('Transformed data:', transformedData);
                    
                    if (transformedData.length === 0) {
                        throw new Error('לא הצלחנו לעבד את הדאטא');
                    }
                    
                    setDataset(transformedData);

                    
                    // Load existing tags from Firebase or localStorage
                    try {
                        const savedTags = await loadTagsFromStorage();
                        setAllTags(savedTags);
                    } catch (error) {
                        console.log('No existing tags found');
                        setAllTags({});
                    }

                    setLoading(false);
                } catch (error) {
                    console.error('Error loading data:', error);
                    const errorMsg = error.message || 'שגיאה לא ידועה';
                    setError(`בעיה בטעינת דאטא מ-HuggingFace: ${errorMsg}. משתמש בדאטא לדוגמה.`);
                    
                    // Use sample data as fallback
                    const sampleData = [
                        {
                            id: 'sample_1',
                            text_before: 'החרתה שאנשים מתחרטים הכי הרבה בסוף חייהם, זה אלווי והייתי נאמן או נאמנה לעצמי. דווקא בסוף החיים אנשים אומרים, הייתי עסוקה יותר מדי בלצבור שיעורות בקורות חיים, בלעשות את הדבר הנכון לפי סטנדרטים של אחרים.',
                            silence_duration: 4.021,
                            text_after: 'שבוע טוב וברוכים הבאים לפרק נוסף בפודקאסט גבולות היגיון אם אתם חדשים כאן אז ברוכים הבאים לפני שנתחיל יש לי בקשה קטנה.',
                            audio_url: null,
                            speaker: 'A',
                            next_speaker: 'B',
                            podcast_id: 'יהודית כץ מוטיבציה'
                        },
                        {
                            id: 'sample_2',
                            text_before: 'זה לא רלוונטי. אבל אמרת לפעול מהמקום הנכון. כן. אתה אתה רוצה אבל שנתחבר לתוכנית המקורית או שאתה רוצה אוקיי אנחנו נתחבר בינתיים.',
                            silence_duration: 1.86,
                            text_after: 'זה אומר. גם האם אני פועלת מתוך הערכים שלי. למשל, הרבה פעמים בטיפול, יש שיטה טיפול שנקראת אקט.',
                            audio_url: null,
                            speaker: 'B',
                            next_speaker: 'A',
                            podcast_id: 'יהודית כץ מוטיבציה'
                        },
                        {
                            id: 'sample_3',
                            text_before: 'כן, הגענו סוף סוף לנושאים של הפרק. לא, דיברת על דחיינות. ברוכה לפרק, שלום, שלומך, בוקר טוב.',
                            silence_duration: 1.781,
                            text_after: 'אני אוהבת את זה שאתה שואל שאלה קצרה, אבל בעצם שואל בה 50 שאלות. זה המקסים.',
                            audio_url: null,
                            speaker: 'B',
                            next_speaker: 'A',
                            podcast_id: 'יהודית כץ מוטיבציה'
                        }
                    ];
                    
                    setDataset(sampleData);
                    setLoading(false);
                }
            };

            const handleLogin = () => {
                if (!username.trim()) return;
                
                // Check if user is admin or registered
                const isUserAdmin = ADMIN_USERS.includes(username.trim());
                const isUserRegistered = registeredUsers[username.trim()];
                
                if (isUserAdmin || isUserRegistered) {
                    setIsLoggedIn(true);
                    setError(null);
                } else {
                    setError('משתמש לא רשום במערכת. פנה למנהל לקבלת גישה.');
                }
            };

            const toggleTag = (tag) => {
                setSelectedTags(prev => 
                    prev.includes(tag) 
                        ? prev.filter(t => t !== tag)
                        : [...prev, tag]
                );
            };

            const saveTags = async () => {
                if (selectedTags.length === 0) return;

                const saveDataset = isAdmin ? dataset : allowedDataset;
                const currentItem = saveDataset[currentIndex];
                const tagEntry = {
                    username,
                    itemId: currentItem.id,
                    text_before: currentItem.text_before,
                    text_after: currentItem.text_after,
                    silence_duration: currentItem.silence_duration,
                    tags: selectedTags,
                    timestamp: new Date().toISOString()
                };

                const updatedTags = { ...allTags };
                if (!updatedTags[currentItem.id]) {
                    updatedTags[currentItem.id] = [];
                }
                
                // Remove existing tag from this user if present
                updatedTags[currentItem.id] = updatedTags[currentItem.id].filter(
                    t => t.username !== username
                );
                updatedTags[currentItem.id].push(tagEntry);

                try {
                    await saveTagsToStorage(updatedTags);
                    setAllTags(updatedTags);
                    
                    // Move to next item
                    if (currentIndex < saveDataset.length - 1) {
                        setCurrentIndex(currentIndex + 1);
                        setSelectedTags([]);
                    }
                } catch (error) {
                    console.error('Error saving tags:', error);
                    alert('שגיאה בשמירת התגיות. נסה שוב.');
                }
            };

            const togglePlayPause = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                    } else {
                        audioRef.current.play();
                    }
                    setIsPlaying(!isPlaying);
                }
            };

            const navigateItem = (direction) => {
                const navDataset = isAdmin ? dataset : allowedDataset;
                const newIndex = currentIndex + direction;
                if (newIndex >= 0 && newIndex < navDataset.length) {
                    setCurrentIndex(newIndex);
                    setSelectedTags([]);
                    setIsPlaying(false);
                    if (audioRef.current) {
                        audioRef.current.pause();
                    }
                }
            };

            const getUserTags = (itemId) => {
                return allTags[itemId] || [];
            };

            const getTagAgreement = (itemId) => {
                const tags = getUserTags(itemId);
                if (tags.length === 0) return {};
                
                const tagCounts = {};
                tags.forEach(entry => {
                    entry.tags.forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                });
                
                return tagCounts;
            };

            // Get all unique users who have tagged
            const getAllUsers = () => {
                const users = new Set();
                Object.values(allTags).forEach(itemTags => {
                    itemTags.forEach(entry => users.add(entry.username));
                });
                return Array.from(users);
            };

            // Get statistics
            const getStatistics = () => {
                const users = getAllUsers();
                const totalItems = dataset.length;
                const taggedItems = Object.keys(allTags).filter(id => allTags[id].length > 0).length;
                
                // Category distribution
                const categoryCount = {};
                CATEGORIES.forEach(cat => categoryCount[cat] = 0);
                
                Object.values(allTags).forEach(itemTags => {
                    itemTags.forEach(entry => {
                        entry.tags.forEach(tag => {
                            if (categoryCount[tag] !== undefined) {
                                categoryCount[tag]++;
                            }
                        });
                    });
                });

                // User statistics
                const userStats = {};
                users.forEach(user => {
                    userStats[user] = {
                        totalTagged: 0,
                        categories: {}
                    };
                    CATEGORIES.forEach(cat => userStats[user].categories[cat] = 0);
                });

                Object.values(allTags).forEach(itemTags => {
                    itemTags.forEach(entry => {
                        if (userStats[entry.username]) {
                            userStats[entry.username].totalTagged++;
                            entry.tags.forEach(tag => {
                                if (userStats[entry.username].categories[tag] !== undefined) {
                                    userStats[entry.username].categories[tag]++;
                                }
                            });
                        }
                    });
                });

                return {
                    totalUsers: users.length,
                    totalItems,
                    taggedItems,
                    categoryCount,
                    userStats,
                    users
                };
            };

            // Get user's tagging details
            const getUserTaggingDetails = (targetUser) => {
                const details = [];
                dataset.forEach((item, index) => {
                    const itemTags = allTags[item.id] || [];
                    const userEntry = itemTags.find(t => t.username === targetUser);
                    if (userEntry) {
                        details.push({
                            index,
                            itemId: item.id,
                            text_before: item.text_before,
                            text_after: item.text_after,
                            silence_duration: item.silence_duration,
                            tags: userEntry.tags,
                            timestamp: userEntry.timestamp
                        });
                    }
                });
                return details;
            };

            // Export tags to JSON - flat format with all data
            const exportTags = () => {
                // Create flat array of all tags with full data
                const flatTags = [];
                Object.entries(allTags).forEach(([itemId, entries]) => {
                    entries.forEach(entry => {
                        flatTags.push({
                            tagger_name: entry.username,
                            item_id: entry.itemId || itemId,
                            text_before: entry.text_before || '',
                            text_after: entry.text_after || '',
                            silence_duration: entry.silence_duration || 0,
                            tags: entry.tags,
                            timestamp: entry.timestamp
                        });
                    });
                });
                
                const dataStr = JSON.stringify(flatTags, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = 'podcast-tags.json';
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            };

            // Export tags to CSV
            const exportTagsCSV = () => {
                const headers = ['tagger_name', 'item_id', 'text_before', 'text_after', 'silence_duration', 'tags', 'timestamp'];
                const rows = [headers.join(',')];
                
                Object.entries(allTags).forEach(([itemId, entries]) => {
                    entries.forEach(entry => {
                        const row = [
                            `"${entry.username}"`,
                            `"${entry.itemId || itemId}"`,
                            `"${(entry.text_before || '').replace(/"/g, '""')}"`,
                            `"${(entry.text_after || '').replace(/"/g, '""')}"`,
                            entry.silence_duration || 0,
                            `"${entry.tags.join('; ')}"`,
                            `"${entry.timestamp}"`
                        ];
                        rows.push(row.join(','));
                    });
                });
                
                const csvContent = rows.join('\n');
                const dataUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
                const exportFileDefaultName = 'podcast-tags.csv';
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-xl text-gray-600">טוען דאטא מ-HuggingFace...</div>

            if (!isLoggedIn) {

                            />
                            <button
                                onClick={handleLogin}
                                className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"

                                </p>
                            </div>
                        </div>
                    </div>

            if (dataset.length === 0) {

                                            <>

                                    </div>
                                    {isAdmin && (

                                                <span>JSON</span>

                                            <button

                                                title="ייצא CSV"
                                            >
                                                <DownloadIcon />
                                                <span>CSV</span>
                                            </button>
                                        </div>
                                    )}
                                    <div className="text-left">
                                        <div className="text-sm text-gray-500">התקדמות</div>
                                        <div className="text-2xl font-bold text-blue-600">
                                            {currentIndex + 1} / {displayDataset.length}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Tabs */}
                            <div className="flex border-b border-gray-200">
                                <button
                                    onClick={() => { setActiveTab('tagging'); setSelectedUser(null); }}

                                >
                                    תיוג
                                </button>
                                {isAdmin && (
                                    <>
                                        <button
                                            onClick={() => { setActiveTab('stats'); setSelectedUser(null); }}
                                            className={`px-6 py-3 font-medium transition ${activeTab === 'stats' ? 'tab-active' : 'text-gray-500 hover:text-gray-700'}`}
                                        >
                                            סטטיסטיקות
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('users')}
                                            className={`px-6 py-3 font-medium transition ${activeTab === 'users' ? 'tab-active' : 'text-gray-500 hover:text-gray-700'}`}

                                            תיוגים לפי משתמש
                                        </button>

                            </div>
                        </div>

                        {/* Tagging Tab */}
                        {activeTab === 'tagging' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Left Panel - Audio & Text */}
                                <div className="lg:col-span-2 space-y-6">
                                    {/* Audio Player */}
                                    <div className="bg-white rounded-2xl shadow-lg p-6">

                                        {currentItem.audio_url ? (
                                            <>
                                                <audio
                                                    ref={audioRef}
                                                    src={currentItem.audio_url}
                                                    onEnded={() => setIsPlaying(false)}
                                                    onError={(e) => console.error('Audio error:', e)}
                                                    className="w-full mb-4"
                                                    controls
                                                />
                                                <div className="flex items-center justify-center gap-4">
                                                    <button
                                                        onClick={() => navigateItem(-1)}
                                                        disabled={currentIndex === 0}
                                                        className="p-3 rounded-full bg-gray-100 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed transition"
                                                    >
                                                        <SkipBackIcon />

                                                    <button

                                                    >

                                        </div>
                                        <div className="bg-orange-50 rounded-lg p-4 text-center">
                                            <div className="text-3xl font-bold text-orange-600">
                                                {stats.totalItems > 0 ? Math.round((stats.taggedItems / stats.totalItems) * 100) : 0}%
                                            </div>
                                            <div className="text-gray-600">אחוז השלמה</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Category Distribution */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">התפלגות קטגוריות</h2>
                                    <div className="space-y-3">
                                        {CATEGORIES.map(category => {
                                            const count = stats.categoryCount[category] || 0;
                                            const maxCount = Math.max(...Object.values(stats.categoryCount), 1);
                                            const percentage = (count / maxCount) * 100;
                                            return (
                                                <div key={category}>
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="text-gray-700">{category}</span>
                                                        <span className="font-medium">{count}</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-2">
                                                        <div 
                                                            className="bg-blue-600 h-2 rounded-full transition-all"
                                                            style={{ width: `${percentage}%` }}
                                                        ></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* User Stats */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 lg:col-span-2">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">סטטיסטיקות משתמשים</h2>
                                    {stats.users.length > 0 ? (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-right">
                                                <thead>
                                                    <tr className="border-b border-gray-200">
                                                        <th className="pb-3 text-gray-600 font-medium">משתמש</th>
                                                        <th className="pb-3 text-gray-600 font-medium">סה"כ תיוגים</th>
                                                        {CATEGORIES.map(cat => (
                                                            <th key={cat} className="pb-3 text-gray-600 font-medium text-sm">{cat}</th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {stats.users.map(user => (
                                                        <tr key={user} className="border-b border-gray-100 hover:bg-gray-50">
                                                            <td className="py-3 font-medium">{user}</td>
                                                            <td className="py-3">
                                                                <span className="px-2 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">
                                                                    {stats.userStats[user].totalTagged}
                                                                </span>
                                                            </td>
                                                            {CATEGORIES.map(cat => (
                                                                <td key={cat} className="py-3 text-sm text-gray-600">
                                                                    {stats.userStats[user].categories[cat]}
                                                                </td>
                                                            ))}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <div className="text-center text-gray-500 py-8">
                                            אין עדיין תיוגים
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Users Tab - Admin only */}
                        {activeTab === 'users' && isAdmin && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                {/* User List */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">משתמשים</h2>
                                    {stats.users.length > 0 ? (
                                        <div className="space-y-2">
                                            {stats.users.map(user => (
                                                <button
                                                    key={user}
                                                    onClick={() => setSelectedUser(user)}
                                                    className={`w-full p-3 rounded-lg text-right transition flex justify-between items-center ${
                                                        selectedUser === user
                                                            ? 'bg-blue-600 text-white'
                                                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                    }`}
                                                >
                                                    <span>{user}</span>
                                                    <span className={`text-sm ${selectedUser === user ? 'text-blue-100' : 'text-gray-500'}`}>
                                                        {stats.userStats[user].totalTagged} תיוגים
                                                    </span>
                                                </button>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center text-gray-500 py-4">
                                            אין עדיין משתמשים
                                        </div>
                                    )}
                                </div>

                                {/* User Details */}
                                <div className="lg:col-span-3 bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">
                                        {selectedUser ? `תיוגים של ${selectedUser}` : 'בחר משתמש'}
                                    </h2>
                                    
                                    {selectedUser ? (
                                        <div className="space-y-4 max-h-[600px] overflow-y-auto">
                                            {getUserTaggingDetails(selectedUser).map((detail, idx) => (
                                                <div key={idx} className="border border-gray-200 rounded-lg p-4 hover:bg-gray-50">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-sm text-gray-500">פריט #{detail.index + 1}</span>
                                                        <span className="text-xs text-gray-400">
                                                            {new Date(detail.timestamp).toLocaleString('he-IL')}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="mb-3">
                                                        <div className="text-sm text-gray-600 mb-1">לפני השתיקה:</div>
                                                        <div className="text-gray-800 text-sm bg-blue-50 p-2 rounded">
                                                            {detail.text_before.substring(0, 150)}...
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="text-center text-sm text-gray-500 my-2">
                                                        שתיקה: {detail.silence_duration.toFixed(2)}s
                                                    </div>
                                                    
                                                    <div className="mb-3">
                                                        <div className="text-sm text-gray-600 mb-1">אחרי השתיקה:</div>
                                                        <div className="text-gray-800 text-sm bg-green-50 p-2 rounded">
                                                            {detail.text_after.substring(0, 150)}...
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex flex-wrap gap-2">
                                                        {detail.tags.map(tag => (
                                                            <span key={tag} className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">
                                                                {tag}
                                                            </span>
                                                        ))}
                                                    </div>
                                                    
                                                    <button
                                                        onClick={() => { setCurrentIndex(detail.index); setActiveTab('tagging'); }}
                                                        className="mt-3 text-sm text-blue-600 hover:text-blue-800"
                                                    >
                                                        עבור לפריט זה ←
                                                    </button>
                                                </div>
                                            ))}
                                            
                                            {getUserTaggingDetails(selectedUser).length === 0 && (
                                                <div className="text-center text-gray-500 py-8">
                                                    למשתמש זה אין תיוגים עדיין
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="text-center text-gray-500 py-8">
                                            בחר משתמש מהרשימה כדי לראות את התיוגים שלו
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* User Management Tab - Admin only */}
                        {activeTab === 'manage' && isAdmin && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Add New User */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">הוסף משתמש חדש</h2>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">שם משתמש</label>
                                            <input
                                                type="text"
                                                value={newUserName}
                                                onChange={(e) => setNewUserName(e.target.value)}
                                                placeholder="הכנס שם משתמש"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">קטגוריות מותרות</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {CATEGORIES.map(category => (
                                                    <button
                                                        key={category}
                                                        onClick={() => toggleNewUserCategory(category)}
                                                        className={`p-2 rounded-lg text-sm font-medium transition ${
                                                            newUserCategories.includes(category)
                                                                ? 'bg-blue-600 text-white'
                                                                : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                        }`}
                                                    >
                                                        {category}
                                                    </button>
                                                ))}
                                            </div>
                                            <button
                                                onClick={() => setNewUserCategories(newUserCategories.length === CATEGORIES.length ? [] : [...CATEGORIES])}
                                                className="mt-2 text-sm text-blue-600 hover:text-blue-800"
                                            >
                                                {newUserCategories.length === CATEGORIES.length ? 'בטל הכל' : 'בחר הכל'}
                                            </button>
                                        </div>
                                        
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="checkbox"
                                                id="newUserAdmin"
                                                checked={newUserIsAdmin}
                                                onChange={(e) => setNewUserIsAdmin(e.target.checked)}
                                                className="w-4 h-4 text-blue-600 rounded"
                                            />
                                            <label htmlFor="newUserAdmin" className="text-sm text-gray-700">מנהל</label>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">פריטים לתיוג (מספרים)</label>
                                            <div className="flex gap-2 items-center">
                                                <input
                                                    type="number"
                                                    min="1"
                                                    max={dataset.length}
                                                    value={newUserItemsStart}
                                                    onChange={(e) => setNewUserItemsStart(e.target.value)}
                                                    placeholder="מ-"
                                                    className="w-20 px-2 py-1 border border-gray-300 rounded text-center"
                                                />
                                                <span className="text-gray-500">עד</span>
                                                <input
                                                    type="number"
                                                    min="1"
                                                    max={dataset.length}
                                                    value={newUserItemsEnd}
                                                    onChange={(e) => setNewUserItemsEnd(e.target.value)}
                                                    placeholder="עד-"
                                                    className="w-20 px-2 py-1 border border-gray-300 rounded text-center"
                                                />
                                                <span className="text-xs text-gray-500">(מתוך {dataset.length})</span>
                                            </div>
                                            <p className="text-xs text-gray-500 mt-1">השאר ריק לגישה לכל הפריטים</p>
                                        </div>
                                        
                                        <button
                                            onClick={addUser}
                                            disabled={!newUserName.trim() || newUserCategories.length === 0}
                                            className="w-full py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition"
                                        >
                                            הוסף משתמש
                                        </button>
                                    </div>
                                </div>

                                {/* Registered Users List */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">משתמשים רשומים ({Object.keys(registeredUsers).length})</h2>
                                    
                                    {Object.keys(registeredUsers).length > 0 ? (
                                        <div className="space-y-4 max-h-[500px] overflow-y-auto">
                                            {Object.entries(registeredUsers).map(([userName, userData]) => (
                                                <div key={userName} className="border border-gray-200 rounded-lg p-4">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <div>
                                                            <span className="font-medium text-gray-800">{userName}</span>
                                                            {userData.isAdmin && (
                                                                <span className="mr-2 px-2 py-0.5 bg-purple-100 text-purple-700 rounded text-xs">מנהל</span>
                                                            )}
                                                        </div>
                                                        <button
                                                            onClick={() => deleteUser(userName)}
                                                            className="text-red-500 hover:text-red-700 text-sm"
                                                        >
                                                            מחק
                                                        </button>
                                                    </div>
                                                    
                                                    <div className="text-sm text-gray-600 mb-2">קטגוריות:</div>
                                                    <div className="flex flex-wrap gap-1">
                                                        {CATEGORIES.map(category => {
                                                            const isAllowed = userData.categories?.includes(category);
                                                            return (
                                                                <button
                                                                    key={category}
                                                                    onClick={() => {
                                                                        const newCategories = isAllowed
                                                                            ? userData.categories.filter(c => c !== category)
                                                                            : [...(userData.categories || []), category];
                                                                        if (newCategories.length > 0) {
                                                                            updateUserCategories(userName, newCategories);
                                                                        }
                                                                    }}
                                                                    className={`px-2 py-1 rounded text-xs transition ${
                                                                        isAllowed
                                                                            ? 'bg-green-100 text-green-700'
                                                                            : 'bg-gray-100 text-gray-400'
                                                                    }`}
                                                                >
                                                                    {category}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                    
                                                    <div className="mt-3 pt-3 border-t border-gray-100">
                                                        <div className="text-sm text-gray-600 mb-2">פריטים מוקצים:</div>
                                                        {editingUserItems === userName ? (
                                                            <div className="flex gap-2 items-center">
                                                                <input
                                                                    type="number"
                                                                    min="1"
                                                                    max={dataset.length}
                                                                    defaultValue={userData.assignedItems?.length > 0 ? Math.min(...userData.assignedItems) + 1 : ''}
                                                                    id={`edit-start-${userName}`}
                                                                    placeholder="מ-"
                                                                    className="w-16 px-2 py-1 border border-gray-300 rounded text-center text-sm"
                                                                />
                                                                <span className="text-gray-500 text-sm">-</span>
                                                                <input
                                                                    type="number"
                                                                    min="1"
                                                                    max={dataset.length}
                                                                    defaultValue={userData.assignedItems?.length > 0 ? Math.max(...userData.assignedItems) + 1 : ''}
                                                                    id={`edit-end-${userName}`}
                                                                    placeholder="עד-"
                                                                    className="w-16 px-2 py-1 border border-gray-300 rounded text-center text-sm"
                                                                />
                                                                <button
                                                                    onClick={() => {
                                                                        const start = document.getElementById(`edit-start-${userName}`).value;
                                                                        const end = document.getElementById(`edit-end-${userName}`).value;
                                                                        updateUserItems(userName, start, end);
                                                                    }}
                                                                    className="px-2 py-1 bg-green-500 text-white rounded text-xs"
                                                                >
                                                                    שמור
                                                                </button>
                                                                <button
                                                                    onClick={() => setEditingUserItems(null)}
                                                                    className="px-2 py-1 bg-gray-300 text-gray-700 rounded text-xs"
                                                                >
                                                                    ביטול
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-sm text-gray-700">
                                                                    {userData.assignedItems?.length > 0 
                                                                        ? `${Math.min(...userData.assignedItems) + 1} - ${Math.max(...userData.assignedItems) + 1} (${userData.assignedItems.length} פריטים)`
                                                                        : 'כל הפריטים'}
                                                                </span>
                                                                <button
                                                                    onClick={() => setEditingUserItems(userName)}
                                                                    className="text-blue-600 hover:text-blue-800 text-xs"
                                                                >
                                                                    ערוך
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    {userData.createdAt && (
                                                        <div className="mt-2 text-xs text-gray-400">
                                                            נוצר: {new Date(userData.createdAt).toLocaleString('he-IL')}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center text-gray-500 py-8">
                                            אין משתמשים רשומים עדיין
                                        </div>
                                    )}
                                </div>

                                {/* Default Admin Users */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 lg:col-span-2">
                                    <h2 className="text-xl font-semibold mb-4 text-gray-800">מנהלים קבועים (בקוד)</h2>
                                    <div className="flex flex-wrap gap-2">
                                        {ADMIN_USERS.map(admin => (
                                            <span key={admin} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm">
                                                {admin}
                                            </span>
                                        ))}
                                    </div>
                                    <p className="text-sm text-gray-500 mt-2">
                                        משתמשים אלו מוגדרים בקוד ותמיד יהיו מנהלים. לשינוי, יש לערוך את הקוד.
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PodcastTaggingApp />);
    </script>
</body>
</html>
